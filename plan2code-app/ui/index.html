<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ipc: http://ipc.localhost; frame-src http://127.0.0.1:*; object-src 'none'; base-uri 'none'">
  <title>Plan2Code</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #1e1e1e; color: #ddd; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    /* The console's dark tokens and its default highlight (Ocean). app.js sets
       the four accent ones to the person's own highlight once the console page
       says which it is, and keeps them for the next launch. */
    :root {
      --panel: #201d1a; --panel-2: #262220; --ink: #f0ece5; --ink-2: #b6afa3; --ink-3: #8b8376; --rule-2: #46403a;
      --accent: #619fe5; --accent-soft: #1a2533; --accent-ink: #0c1117; --accent-line: #3d5978;
    }

    #bar { flex: none; border-bottom: 1px solid #444; }
    /* The console's top bar buttons (.btn small ghost), sized to this bar:
       quiet until hovered, then in the highlight color. New Session is the
       one that is often the next step, so it wears the highlight outline at
       rest, like the console's standby buttons. */
    #bar button {
      appearance: none; font: inherit; font-size: 12px; font-weight: 600; line-height: 1.2;
      padding: 4px 10px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--rule-2); background: var(--panel); color: var(--ink-2);
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    #bar button:hover:not(:disabled) { color: var(--accent); border-color: var(--accent-line); background: var(--panel-2); }
    #bar button:disabled { opacity: 0.45; cursor: not-allowed; }
    #bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #bar #agent-restart { background: transparent; border-color: var(--accent-line); color: var(--accent); }
    #bar #agent-restart:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
    #bar-row { height: 34px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 12px; white-space: nowrap; overflow-x: auto; overflow-y: hidden; }
    #bar [hidden] { display: none !important; }
    /* The project and agent menus' triggers: plain text until hovered, a
       caret saying there is more behind them. */
    #bar .bar-menu { display: inline-flex; align-items: center; gap: 6px; flex: none; border-color: transparent; background: transparent; color: var(--ink); padding: 4px 8px; }
    #bar .bar-menu:hover:not(:disabled), #bar .bar-menu[aria-expanded="true"] { background: var(--panel-2); border-color: transparent; color: var(--ink); }
    .bar-caret { color: var(--ink-3); font-size: 10px; }
    #project-name { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
    .agent-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #666; }
    .agent-dot.is-ok { background: #6a9955; }
    .agent-dot.is-warn { background: #d7ba7d; }
    #agent-ended { color: var(--ink-3); font-weight: 400; }
    #agent-bypass { flex: none; font-size: 11px; font-weight: 600; line-height: 1.3; padding: 0 7px; border-radius: 999px; border: 1px solid #d7ba7d; color: #d7ba7d; }
    #agent-none { color: var(--ink-3); }
    #agent-status { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 320px; }
    #agent-status.is-error { color: #f48771; }
    #bar-grow { flex: 1; min-width: 0; }
    /* The one next step for the console or the skills, at the right end. */
    #next-step { display: flex; align-items: center; gap: 8px; flex: none; }
    #next-step-text { overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
    #next-step-text.is-ok { color: #6a9955; }
    #next-step-text.is-warn { color: #d7ba7d; }
    #next-step-text.is-err { color: #f48771; }
    #next-step-text.is-busy::before {
      content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: -1px;
      border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: bar-spin 0.8s linear infinite;
    }
    @keyframes bar-spin { to { transform: rotate(360deg); } }
    #bar #next-step-button { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    #bar #next-step-button:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); filter: brightness(1.12); }
    #next-step-more { color: var(--ink-3); font-size: 11px; border-bottom: 1px dotted var(--ink-3); cursor: help; }
    /* The menus sit outside the scrolling row (fixed, placed under their
       trigger by app.js), so the row's overflow never clips them. */
    .bar-dropdown {
      position: fixed; z-index: 20; min-width: 240px; max-width: 380px; padding: 6px; box-sizing: border-box;
      font-size: 12px; background: var(--panel); border: 1px solid var(--rule-2); border-radius: 8px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }
    .bar-dropdown-head { margin: 0; padding: 4px 8px 8px; color: var(--ink-3); line-height: 1.45; overflow-wrap: anywhere; }
    .bar-dropdown-head b { color: var(--ink); font-weight: 600; }
    .bar-dropdown-head .is-warn { color: #d7ba7d; }
    #bar .bar-dropdown button {
      display: block; width: 100%; text-align: left; font-weight: 400; padding: 6px 8px; border: 0; border-radius: 6px;
      background: transparent; color: var(--ink);
    }
    #bar .bar-dropdown button:hover:not(:disabled), #bar .bar-dropdown button:focus-visible { background: var(--panel-2); color: var(--accent); }

    #workspace { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #workspace.dock-right { flex-direction: row; }

    #dashboard { flex: 1; min-height: 0; min-width: 0; position: relative; }
    #console-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #1e1e1e; }
    #dashboard-state { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #1e1e1e; text-align: center; padding: 16px; box-sizing: border-box; }
    #dashboard-state[hidden] { display: none; }
    #dashboard-state-text { margin: 0; max-width: 60ch; overflow-wrap: anywhere; color: #bbb; }
    #dashboard-state-planny[hidden] { display: none; }
    /* Drawn and colored like the console's own Planny (styles/planny.css):
       an outlined shell, the star eye, a lip of a smile, round hands. */
    #dashboard-state-planny { width: 104px; height: auto; overflow: visible; }
    #dashboard-state-planny :is(.ps-shell, .ps-smile, .ps-arm path, .ps-mug, .ps-handle) {
      fill: none; stroke: var(--ink-2); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round;
    }
    #dashboard-state-planny .ps-shell { fill: var(--panel-2); }
    #dashboard-state-planny .ps-smile { stroke-width: 0.9; }
    #dashboard-state-planny .ps-arm path { stroke-width: 1.2; }
    #dashboard-state-planny :is(.ps-arm circle, .ps-foot) { fill: var(--ink-2); stroke: none; }
    #dashboard-state-planny .ps-eye { fill: var(--ink); }
    #dashboard-state-planny .ps-mug { fill: var(--panel-2); stroke-width: 1; }
    #dashboard-state-planny .ps-handle { stroke-width: 0.9; }
    #dashboard-state-planny .ps-coffee { fill: #9a6b47; }
    #dashboard-state-planny .ps-steam path {
      fill: none; stroke: var(--ink-3); stroke-width: 0.7; stroke-linecap: round;
      animation: ps-steam 2.4s ease-in-out infinite; opacity: 0;
    }
    #dashboard-state-planny .ps-steam path:nth-child(2) { animation-delay: 0.8s; }
    #dashboard-state-planny .ps-steam path:nth-child(3) { animation-delay: 1.6s; }
    @keyframes ps-steam {
      0% { opacity: 0; transform: translateY(1px); }
      35% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-2.4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #dashboard-state-planny .ps-steam path { animation: none; opacity: 0.8; }
    }
    /* The console's buttons (.btn, with .primary for the way forward): the
       one action wears the highlight, Cancel is a plain button. */
    #dashboard-state-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    #dashboard-state-actions button {
      appearance: none; font: inherit; font-size: 13.5px; font-weight: 600; line-height: 1.2;
      padding: 7px 13px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--rule-2); background: var(--panel); color: var(--ink);
      transition: filter 0.12s, background 0.12s;
    }
    #dashboard-state-actions button:hover { background: var(--panel-2); }
    #dashboard-state-actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #dashboard-state-actions #dashboard-state-button { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    #dashboard-state-actions #dashboard-state-button:hover { background: var(--accent); filter: brightness(1.08); }
    #dashboard-state-actions button[hidden] { display: none; }

    #launch-card {
      position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
      align-items: stretch; justify-content: center; gap: 10px; background: #1e1e1e;
      padding: 24px; box-sizing: border-box; width: min(360px, 100%); margin: 0 auto;
    }
    #launch-card[hidden] { display: none; }
    #launch-card h2 { margin: 0 0 6px; font-size: 17px; text-align: center; }
    #launch-card label { font-size: 12px; color: #9ab; }
    #launch-card select, #launch-card input[type="text"] {
      width: 100%; box-sizing: border-box; margin: 4px 0 2px; padding: 6px 8px;
      background: #2a2a2a; color: #ddd; border: 1px solid #555; border-radius: 4px; font: inherit;
    }
    #launch-missing { margin: 0; font-size: 12px; color: #d7ba7d; }
    #launch-missing code { color: #ddd; }
    #launch-agents-warning { margin: 0; font-size: 12px; color: #d7ba7d; white-space: pre-line; }
    #launch-agents-warning[hidden] { display: none; }
    .agent-explainer { margin: 0; font-size: 12px; line-height: 1.5; }
    .agent-explainer ul { margin: 4px 0; padding-left: 18px; }
    .agent-explainer code { color: #ddd; }
    .agent-explainer button, #launch-missing button { font: inherit; font-size: 12px; margin-left: 6px; padding: 1px 8px; cursor: pointer; }
    .agent-explainer .agent-link, #launch-missing .agent-link { background: none; border: 0; padding: 0; color: #75beff; text-decoration: underline; }
    #launch-effort-row[hidden] { display: none; }
    #launch-bypass-row { display: flex; align-items: center; gap: 8px; color: #ccc; font-size: 13px; cursor: pointer; }
    #launch-bypass-row input { margin: 0; }
    #launch-bypass-warning { margin: 0; font-size: 12px; color: #d7ba7d; }
    #launch-bypass-warning[hidden] { display: none; }
    #launch-start {
      margin-top: 6px; padding: 8px; background: #2d6a4f; color: #fff; border: 0; border-radius: 4px;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    #launch-start:hover { background: #357a5c; }
    #launch-start:disabled { background: #444; color: #888; cursor: not-allowed; }

    #first-run {
      position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
      align-items: stretch; justify-content: center; gap: 14px; background: #1e1e1e;
      padding: 24px; box-sizing: border-box; width: min(420px, 100%); margin: 0 auto;
    }
    #first-run[hidden] { display: none; }
    #first-run h2 { margin: 0; font-size: 17px; text-align: center; }
    #first-run-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .first-run-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; }
    .first-run-mark { flex: none; width: 16px; text-align: center; font-weight: 700; }
    .first-run-row.is-pass .first-run-mark { color: #6a9955; }
    .first-run-row.is-fail .first-run-mark { color: #d7ba7d; }
    .first-run-body { flex: 1; min-width: 0; }
    .first-run-title { color: #ddd; }
    .first-run-detail { color: #9ab; font-size: 12px; margin-top: 2px; }
    .first-run-detail code { color: #ddd; }
    .first-run-row button {
      margin-top: 4px; background: none; border: 1px solid #555; color: #ccc; border-radius: 3px;
      font: inherit; font-size: 12px; padding: 3px 8px; cursor: pointer;
    }
    .first-run-row button:hover { background: #333; }
    #first-run-start {
      margin-top: 6px; padding: 8px; background: #2d6a4f; color: #fff; border: 0; border-radius: 4px;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    #first-run-start:hover { background: #357a5c; }
    #first-run-start:disabled { background: #444; color: #888; cursor: not-allowed; }

    #term-handle { flex: none; background: #2a2a2a; }
    #term-handle:hover { background: #3d3d3d; }
    #term-handle[hidden] { display: none; }
    #workspace:not(.dock-right) #term-handle { height: 6px; cursor: row-resize; }
    #workspace.dock-right #term-handle { width: 6px; cursor: col-resize; }

    #term-panel { flex: none; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    #workspace:not(.dock-right) #term-panel { border-top: 1px solid #444; }
    #workspace.dock-right #term-panel { border-left: 1px solid #444; }
    #term-panel.collapsed { height: 28px !important; }
    #workspace.dock-right #term-panel.collapsed { width: 28px !important; height: auto !important; }
    #term-panel.collapsed #term { display: none; }
    #term-toolbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 3px 6px; background: #252525; font-size: 11px; }
    #workspace.dock-right #term-toolbar { flex-direction: column; align-items: stretch; }
    #term-toolbar-spacer { flex: 1; min-height: 0; }
    #term-toolbar button {
      background: none; border: 1px solid #555; color: #ccc; border-radius: 3px;
      font-size: 11px; padding: 2px 6px; cursor: pointer; font-family: inherit;
    }
    #term-toolbar button:hover { background: #333; }
    #term-toolbar button[aria-pressed="true"] { color: #fff; border-color: #888; }
    #term-panel.collapsed #term-dock, #term-panel.collapsed #term-maximize { display: none; }
    /* Docked right and collapsed, the panel is a 28px-wide strip: "View Agent
       Terminal" does not fit sideways, so it reads top-to-bottom instead, rotated the
       same way a reader would turn the panel to read it. */
    #workspace.dock-right #term-panel.collapsed #term-toolbar { padding: 6px 2px; align-items: center; }
    #workspace.dock-right #term-panel.collapsed #term-collapse {
      writing-mode: vertical-rl; text-orientation: mixed; padding: 6px 2px;
    }
    #term-badge { color: #d7ba7d; font-size: 14px; line-height: 1; }
    #term-badge[hidden] { display: none; }
    #term { flex: 1; min-height: 0; min-width: 0; padding: 4px; }
  </style>
</head>
<body>
  <header id="bar">
    <div id="bar-row">
      <button id="project-menu-button" class="bar-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="project-menu" hidden><span id="project-name"></span><span class="bar-caret" aria-hidden="true">&#9662;</span></button>
      <!-- Whenever an agent exists, running or ended, just left of its menu. -->
      <button id="agent-restart" hidden>New Session</button>
      <button id="agent-menu-button" class="bar-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="agent-menu" hidden><span id="agent-dot" class="agent-dot" aria-hidden="true"></span><span id="agent-name"></span><span id="agent-ended" hidden>ended</span><span id="agent-bypass" title="Permission checks are off: the agent runs commands and changes files without asking" hidden>checks off</span><span class="bar-caret" aria-hidden="true">&#9662;</span></button>
      <span id="agent-none">No agent</span>
      <span id="agent-status" role="status"></span>
      <span id="bar-grow"></span>
      <!-- The console's or the skills' one next step (meter.js barNextSteps), when there is one. -->
      <span id="next-step" role="status" hidden>
        <span id="next-step-text"></span>
        <button id="next-step-button" hidden></button>
        <span id="next-step-more" hidden></span>
      </span>
    </div>
    <div id="project-menu" class="bar-dropdown" role="menu" aria-label="Project" hidden>
      <p class="bar-dropdown-head">Project<br><b id="project-path"></b></p>
      <button id="change-project" role="menuitem">Change project...</button>
    </div>
    <div id="agent-menu" class="bar-dropdown" role="menu" aria-label="Agent" hidden>
      <p id="agent-menu-head" class="bar-dropdown-head"></p>
      <button id="change-agent" role="menuitem" hidden>Change agent...</button>
    </div>
  </header>
  <div id="workspace">
    <main id="dashboard">
      <iframe id="console-frame" title="Plan2Code console dashboard" allow="clipboard-write"></iframe>
      <div id="dashboard-state" hidden>
        <!-- Planny on a coffee break: shown only before a New Session press,
             the one state here that is a question rather than a status. The
             console's own Planny (shell, star eye, smile, feet, resting left
             arm) with the right arm reaching out to a steaming mug. -->
        <svg id="dashboard-state-planny" viewBox="0 7 29 23" aria-hidden="true" focusable="false" hidden>
          <rect class="ps-foot" x="5.7" y="27.1" width="3.6" height="1.7" rx="0.85" />
          <rect class="ps-foot" x="12.7" y="27.1" width="3.6" height="1.7" rx="0.85" />
          <rect class="ps-shell" x="3" y="7" width="16" height="20" rx="3.2" />
          <path class="ps-eye" d="M11 10.95 L11.79 12.91 L13.9 13.06 L12.28 14.42 L12.79 16.47 L11 15.35 L9.21 16.47 L9.72 14.42 L8.1 13.06 L10.21 12.91 Z" />
          <path class="ps-smile" d="M8.3 18.4 Q11 21 13.7 18.4" />
          <g class="ps-arm"><path d="M3 18 L1.3 21" /><circle cx="1.3" cy="21" r="0.85" /></g>
          <g class="ps-steam">
            <path d="M23 17.3 q-0.6 -0.9 0 -1.8 t0 -1.8" />
            <path d="M24.4 17.1 q0.6 -0.9 0 -1.8 t0 -1.8" />
            <path d="M25.8 17.3 q-0.6 -0.9 0 -1.8 t0 -1.8" />
          </g>
          <g class="ps-arm"><path d="M19 18 L21.6 20.6" /><circle cx="21.6" cy="20.6" r="0.85" /></g>
          <path class="ps-handle" d="M26.7 19.6 h0.3 a1.15 1.15 0 0 1 0 2.3 h-0.3" />
          <rect class="ps-mug" x="22.4" y="18.4" width="4.3" height="4.6" rx="0.8" />
          <rect class="ps-coffee" x="23" y="19" width="3.1" height="0.8" rx="0.35" />
        </svg>
        <p id="dashboard-state-text"></p>
        <span id="dashboard-state-actions">
          <button id="dashboard-state-button" hidden></button>
          <button id="dashboard-state-cancel" hidden>Cancel</button>
        </span>
      </div>
      <div id="first-run" hidden>
        <h2>Before you start</h2>
        <ul id="first-run-list"></ul>
        <button id="first-run-start" type="button" disabled>Start</button>
      </div>
      <form id="launch-card" hidden>
        <h2>Start an agent</h2>
        <label for="launch-agent">Agent</label>
        <select id="launch-agent">
          <option value="claude">Claude Code</option>
          <option value="devin">Devin</option>
          <option value="codex">Codex</option>
        </select>
        <p id="launch-missing" hidden></p>
        <p id="launch-agents-warning" hidden></p>
        <label for="launch-model">Model</label>
        <input id="launch-model" type="text" placeholder="Default (your account setting)" autocomplete="off" list="launch-model-list">
        <datalist id="launch-model-list"></datalist>
        <div id="launch-effort-row">
          <label for="launch-effort">Effort</label>
          <select id="launch-effort"></select>
        </div>
        <label id="launch-bypass-row">
          <input id="launch-bypass" type="checkbox" checked>
          Turn permission checks off for this agent
        </label>
        <p id="launch-bypass-warning">Permission checks will be off: the agent can run commands and change files without asking first.</p>
        <button id="launch-start" type="submit">Start agent</button>
      </form>
    </main>
    <div id="term-handle" title="Drag to resize the terminal panel"></div>
    <section id="term-panel">
      <div id="term-toolbar">
        <span id="term-badge" title="The agent has been quiet a while" hidden>●</span>
        <span id="term-toolbar-spacer"></span>
        <button id="term-dock" type="button">Dock right</button>
        <button id="term-maximize" type="button" aria-pressed="false">Maximize</button>
        <button id="term-collapse" type="button" aria-pressed="false">Collapse</button>
      </div>
      <div id="term"></div>
    </section>
  </div>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
