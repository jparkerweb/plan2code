<style>
  .step-a { background: var(--p2c-surface); color: var(--p2c-text); font-family: var(--p2c-font); padding: var(--p2c-space-4); border-radius: var(--p2c-radius); }
  .step-a button { background: var(--p2c-accent); color: var(--p2c-on-accent); border: 0; padding: var(--p2c-space-2); }
</style>
<section class="step-a" data-p2c-step="1. Account">
  <h2 data-p2c-text="short">Join</h2>
  <h2 data-p2c-text="typical">Create your account</h2>
  <h2 data-p2c-text="long">Create your account to start tracking the invoices of every customer you bill</h2>
  <p data-p2c-when="ready">Email and a password.</p>
  <p data-p2c-when="empty">Start with your work email.</p>
  <p data-p2c-when="loading">Checking...</p>
  <p data-p2c-when="error">That email is already taken.</p>
  <button>Continue</button>
</section>
<section class="step-a" data-p2c-step="2. Team">
  <h2>Invite your team</h2>
  <button>Send invites</button>
</section>
<section class="step-a" data-p2c-step="3. Done">
  <h2>You are all set</h2>
</section>
